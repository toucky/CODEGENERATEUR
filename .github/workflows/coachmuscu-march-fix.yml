name: CoachMuscu March Real Animation Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Reconstruct and patch Android project
        shell: bash
        run: |
          set -euo pipefail
          cat coach-build/chunks/p* > /tmp/coachmuscu-source.b64
          base64 --decode /tmp/coachmuscu-source.b64 > /tmp/CoachMuscu-source.zip
          echo "4b82b8362ce7adcc6a444b43939ca7211d0ab4b6cb377fe36b32e142439319c8  /tmp/CoachMuscu-source.zip" | sha256sum -c -
          mkdir -p /tmp/coach-project
          unzip -q /tmp/CoachMuscu-source.zip -d /tmp/coach-project
          ROOT=/tmp/coach-project/CoachMuscu

          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/coach-project/CoachMuscu')
          p=root/'app/src/main/res/values/strings.xml'
          p.write_text(p.read_text(encoding='utf-8').replace("Rappels d'entraînement", "Rappels d\\'entraînement"),encoding='utf-8')
          for rel in ['app/src/main/java/com/appmada/coachmuscu/MainActivity.java','app/src/main/java/com/appmada/coachmuscu/CalendarActivity.java']:
              q=root/rel
              q.write_text(q.read_text(encoding='utf-8').replace('StatsStore.currentStreak()', 'StatsStore.currentStreak(this)'),encoding='utf-8')
          for rel in ['app/src/main/java/com/appmada/coachmuscu/WorkoutActivity.java','app/src/main/java/com/appmada/coachmuscu/ExerciseDetailActivity.java']:
              q=root/rel
              s=q.read_text(encoding='utf-8')
              s=s.replace('ExerciseAnimationView anim;', 'ExerciseMediaView anim;')
              s=s.replace('anim=new ExerciseAnimationView(this);', 'anim=new ExerciseMediaView(this);')
              s=s.replace('ExerciseAnimationView a=new ExerciseAnimationView(this);', 'ExerciseMediaView a=new ExerciseMediaView(this);')
              q.write_text(s,encoding='utf-8')
          PY

          cp coach-build/patches/ExerciseMediaView.java "$ROOT/app/src/main/java/com/appmada/coachmuscu/ExerciseMediaView.java"
          mkdir -p "$ROOT/app/src/main/res/drawable-nodpi"
          base64 --decode coach-build/assets/pushup_real_top.webp.b64 > "$ROOT/app/src/main/res/drawable-nodpi/pushup_real_top.webp"
          base64 --decode coach-build/assets/pushup_real_bottom.webp.b64 > "$ROOT/app/src/main/res/drawable-nodpi/pushup_real_bottom.webp"

          base64 --decode coach-build/assets/march_real_assets.zip.b64 > /tmp/march-real.zip
          echo "658889335f80b2a84756f5b4d1bba7ddf6505ea8b787d2ab06b1877e594e30d4  /tmp/march-real.zip" | sha256sum -c -
          unzip -q /tmp/march-real.zip -d "$ROOT/app/src/main/res/drawable-nodpi"
          test -s "$ROOT/app/src/main/res/drawable-nodpi/march_real_left.webp"
          test -s "$ROOT/app/src/main/res/drawable-nodpi/march_real_center.webp"
          test -s "$ROOT/app/src/main/res/drawable-nodpi/march_real_right.webp"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: /tmp/coach-project/CoachMuscu
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/coach-project/CoachMuscu/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          mkdir -p artifact
          cp "$APK" artifact/CoachMuscu-APP-MADA-v1.2-MARCH-REAL.apk
          sha256sum artifact/CoachMuscu-APP-MADA-v1.2-MARCH-REAL.apk > artifact/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoachMuscu-APP-MADA-v1.2-MARCH-REAL
          path: artifact/
          if-no-files-found: error
          retention-days: 7
