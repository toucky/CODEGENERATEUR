name: Temporary CoachMuscu APK Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Reconstruct and verify Android project
        shell: bash
        run: |
          set -euo pipefail
          cat coach-build/chunks/p* > /tmp/coachmuscu-source.b64
          test "$(wc -c < /tmp/coachmuscu-source.b64)" -eq 72660
          base64 --decode /tmp/coachmuscu-source.b64 > /tmp/CoachMuscu-source.zip
          test "$(wc -c < /tmp/CoachMuscu-source.zip)" -eq 54495
          echo "4b82b8362ce7adcc6a444b43939ca7211d0ab4b6cb377fe36b32e142439319c8  /tmp/CoachMuscu-source.zip" | sha256sum -c -
          mkdir -p /tmp/coach-project
          unzip -q /tmp/CoachMuscu-source.zip -d /tmp/coach-project
          test -f /tmp/coach-project/CoachMuscu/app/build.gradle
          test -f /tmp/coach-project/CoachMuscu/app/src/main/AndroidManifest.xml

      - name: Apply verified resource fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/coach-project/CoachMuscu/app/src/main/res/values/strings.xml')
          s = p.read_text(encoding='utf-8')
          s = s.replace("Rappels d'entraînement", "Rappels d\\'entraînement")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: /tmp/coach-project/CoachMuscu
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/coach-project/CoachMuscu/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          mkdir -p artifact
          cp "$APK" artifact/CoachMuscu-APP-MADA-v1.0.0.apk
          sha256sum artifact/CoachMuscu-APP-MADA-v1.0.0.apk > artifact/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoachMuscu-APP-MADA-v1.0.0
          path: artifact/
          if-no-files-found: error
          retention-days: 7
