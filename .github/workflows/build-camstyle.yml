name: Build CamStyle AI APK

on:
  push:
    branches:
      - camstyle-ai-build-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: camstyle-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp camstyle-build/app/build/outputs/apk/debug/app-debug.apk CamStyle-AI-Test.apk
          sha256sum CamStyle-AI-Test.apk > CamStyle-AI-Test.sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamStyle-AI-Test
          path: |
            CamStyle-AI-Test.apk
            CamStyle-AI-Test.sha256.txt
          retention-days: 7
