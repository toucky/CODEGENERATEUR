name: Build Parle Francais APK

on:
  push:
    branches:
      - parle-francais-apk-test
    paths:
      - 'parle-francais-android/**'
      - '.github/workflows/parle-francais-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parle-francais-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Parle-Francais-APP-MADA-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Parle-Francais-APP-MADA-Test
          path: parle-francais-android/app/build/outputs/apk/debug/Parle-Francais-APP-MADA-Test.apk
          if-no-files-found: error
