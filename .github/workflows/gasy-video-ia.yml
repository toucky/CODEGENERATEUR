name: Build Gasy Video IA APK

on:
  push:
    branches: [ "build-gasy-video-ia-v1-0-1" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore HTML interface
        run: |
          base64 -d app/src/main/assets/index.html.gz.b64 | gzip -d > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platforms/android-35"
          test -d "${ANDROID_HOME}/build-tools/35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Gasy-Video-IA-v1.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gasy-Video-IA-v1.0.1
          path: Gasy-Video-IA-v1.0.1.apk
          if-no-files-found: error
