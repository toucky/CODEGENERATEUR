name: CoachMuscu Direct APK Build

on:
  push:
    branches: [coachmuscu-apk-build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: coachmuscu-apk-build

      - name: Reconstruct and verify Android project
        shell: bash
        run: |
          set -euo pipefail
          cat coach-build/chunks/p* > /tmp/coachmuscu-source.b64
          test "$(wc -c < /tmp/coachmuscu-source.b64)" -eq 72660
          base64 --decode /tmp/coachmuscu-source.b64 > /tmp/CoachMuscu-source.zip
          test "$(wc -c < /tmp/CoachMuscu-source.zip)" -eq 54495
          echo "4b82b8362ce7adcc6a444b43939ca7211d0ab4b6cb377fe36b32e142439319c8  /tmp/CoachMuscu-source.zip" | sha256sum -c -
          mkdir -p /tmp/coach-project
          unzip -q /tmp/CoachMuscu-source.zip -d /tmp/coach-project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: /tmp/coach-project/CoachMuscu
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/coach-project/CoachMuscu/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          mkdir -p build-output
          cp "$APK" build-output/CoachMuscu-APP-MADA-v1.0.0.apk
          sha256sum build-output/CoachMuscu-APP-MADA-v1.0.0.apk > build-output/SHA256.txt

      - name: Commit verified APK to build branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/CoachMuscu-APP-MADA-v1.0.0.apk build-output/SHA256.txt
          git commit -m "Publish verified CoachMuscu APK"
          git push origin HEAD:coachmuscu-apk-build
