plugins {
    id 'com.android.application'
}

android {
    namespace 'mg.appmada.camstyle'
    compileSdk 35

    defaultConfig {
        applicationId 'mg.appmada.camstyle'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1-test'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
